name: metrics

on:
  schedule:
    - cron: "0 0 * * 1"  # Mondays 00:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [scripts/collect_metrics.py, .github/workflows/metrics.yml]

permissions:
  contents: read

env:
  # ponytail: space-separated list; one CSV row per model per week.
  HF_MODELS: sparrow-co-ltd/qwen35-9b-secfix-grpo-lead-step300-merged sparrow-co-ltd/qwen35-9b-secfix-grpo-step180

# No top-level concurrency: a shared group would let a PR `test` run displace a queued publish.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ponytail: stdlib-only script on the runner's python3, same as validate.yml.
      - run: python3 -W error scripts/collect_metrics.py --self-test
      - if: github.event_name == 'pull_request'
        run: python3 scripts/collect_metrics.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'pull_request'
        run: for m in $HF_MODELS; do python3 scripts/collect_metrics.py --hf "$m"; done

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only to append metrics/github-kpi.csv on the `metrics` branch
      issues: read
      pull-requests: read
    concurrency:
      group: metrics-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/collect_metrics.py --publish metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Separate job: a failed HF fetch can be re-run without appending a second GitHub row.
  publish-hf:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only to append metrics/hf-kpi.csv on the `metrics` branch
    concurrency:
      group: metrics-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: for m in $HF_MODELS; do python3 scripts/collect_metrics.py --hf "$m" --publish metrics; done
        env:
          GITHUB_TOKEN: ${{ github.token }}
