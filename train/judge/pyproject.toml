[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secllm-judge"
version = "0.1.0"
description = "LLM-judge prompt blocks, diff renderer, typed contracts and client used by SFT trajectory selection"
requires-python = "==3.12.*"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.12.12",
    "typer==0.27.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secllm_judge"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D", "INP001", "ANN", "E501", "RUF005", "FLY002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
